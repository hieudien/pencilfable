<!doctype html>
<!-- Source of public/og.png (the picture shown when a link is shared). Regenerate with:
     chrome --headless --window-size=1200,630 --screenshot=public/og.png file:///…/scripts/og.html -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { width: 1200px; height: 630px; overflow: hidden; background: #047857; font-family: 'Segoe UI', 'Nunito', system-ui, sans-serif; color: #fff; position: relative; }
      .left { position: absolute; left: 72px; top: 70px; width: 600px; }
      .logo { display: flex; align-items: center; gap: 16px; font-size: 38px; font-weight: 900; }
      .logo b { width: 60px; height: 60px; border-radius: 16px; background: #fff; color: #047857; display: flex; align-items: center; justify-content: center; font-size: 36px; }
      h1 { margin-top: 48px; font-size: 70px; line-height: 1.04; font-weight: 900; letter-spacing: -1.5px; }
      h1 span { color: #fcd34d; }
      p { margin-top: 24px; font-size: 28px; white-space: nowrap; font-weight: 700; color: #d1fae5; }
      .pill { position: absolute; left: 72px; bottom: 56px; background: #f97316; color: #fff; font-size: 30px; font-weight: 900; padding: 14px 30px; border-radius: 16px; }
      .sheet { position: absolute; background: #fff; border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.35); padding: 26px; color: #1c1917; }
      .s1 { left: 760px; top: 70px; width: 300px; height: 400px; transform: rotate(6deg); }
      .s2 { left: 700px; top: 200px; width: 300px; height: 400px; transform: rotate(-7deg); }
      .t { font-size: 24px; font-weight: 900; text-align: center; margin-bottom: 14px; }
      .grid { display: grid; grid-template-columns: repeat(8, 1fr); border: 3px solid #1c1917; }
      .grid i { aspect-ratio: 1; border: 1px solid #d6d3d1; font-style: normal; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; }
      .grid i.on { background: #fcd34d; }
      .maze { border: 4px solid #1c1917; height: 270px; background:
        linear-gradient(#1c1917,#1c1917) 20% 0/6px 70% no-repeat,
        linear-gradient(#1c1917,#1c1917) 45% 30%/6px 70% no-repeat,
        linear-gradient(#1c1917,#1c1917) 70% 0/6px 70% no-repeat,
        linear-gradient(#1c1917,#1c1917) 0 45%/45% 6px no-repeat,
        linear-gradient(#1c1917,#1c1917) 100% 70%/55% 6px no-repeat; }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="logo"><b>P</b> Pencilfable</div>
      <h1>Free printable <span>games &amp; worksheets</span></h1>
      <p>Word searches, mazes, math games &amp; more</p>
    </div>
    <div class="pill">20 free tools · no sign-up</div>
    <div class="sheet s2"><div class="t">Maze Adventure</div><div class="maze"></div></div>
    <div class="sheet s1">
      <div class="t">Fruit Word Search</div>
      <div class="grid" id="g"></div>
    </div>
    <script>
      const rows = ['APPLEBXM','KQZRTSVW','ORANGEJD','ZSTUWBHK','BANANAYF','GRAPEVLC','CIKPEARN','TOAPPLEB'];
      const on = new Set(['0:0-4','2:0-5','4:0-5','5:0-4','6:3-6']);
      const hit = (r, c) => [...on].some((k) => { const [row, rng] = k.split(':'); const [a, b] = rng.split('-').map(Number); return +row === r && c >= a && c <= b; });
      const g = document.getElementById('g');
      rows.forEach((row, r) => [...row].forEach((ch, c) => { const i = document.createElement('i'); i.textContent = ch; if (hit(r, c)) i.className = 'on'; g.appendChild(i); }));
    </script>
  </body>
</html>
